<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dreadgence Demo · 1.0.64</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#130b10;color:#ebd6b5;font:16px system-ui}
#unity-canvas{display:block;width:100%;height:100%;outline:none;background:#130b10}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#130b10;gap:18px}
progress{width:min(420px,70vw);accent-color:#ad7833} #error{max-width:700px;white-space:pre-wrap}
#browser-controls{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:8px;opacity:.35} #browser-controls:hover,#browser-controls:focus-within{opacity:1}
button,a{border:1px solid #936c36;border-radius:4px;padding:7px 12px;background:#24151c;color:#ebd6b5;font:inherit}
#external{position:absolute;inset:0;background:#130b10e8;align-items:center;justify-content:center;gap:16px;flex-direction:column}
[hidden]{display:none!important}
</style></head><body>
<canvas id="unity-canvas" width="1280" height="800" tabindex="0" aria-label="Dreadgence Demo"></canvas>
<div id="loading" role="status"><strong>DREADGENCE</strong><span>Loading demo…</span><progress id="progress" value="0" max="1"></progress><span id="error"></span></div>
<div id="browser-controls"><button id="fullscreen" type="button" aria-label="Fullscreen">⛶</button></div>
<div id="external" hidden><span>Your browser blocked the new tab. Open the link below.</span><a id="external-link" target="_blank" rel="noopener noreferrer">Open link</a><button id="close-link">Return to game</button></div>
<script src="Build/Dreadgence-Demo-1.0.64.loader.js"></script><script>
const canvas=document.getElementById('unity-canvas');
document.getElementById('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(e=>console.warn(e.message));};
document.addEventListener('dreadgence-link-blocked', e=>{const a=document.getElementById('external-link');a.href=e.detail;a.textContent=e.detail.includes('store.steampowered.com')?'Open Dreadgence on Steam':'Open link';document.getElementById('external').hidden=false;document.getElementById('external').style.display='flex';a.focus();});
document.getElementById('external-link').onclick=()=>{document.getElementById('external').hidden=true;canvas.focus();};
document.getElementById('close-link').onclick=()=>{document.getElementById('external').hidden=true;canvas.focus();};
window.addEventListener('keydown',e=>{
if(document.getElementById('external').hidden)return;
e.stopImmediatePropagation();
if(e.key==='Escape'){e.preventDefault();document.getElementById('close-link').click();}
if(e.key==='Enter'&&document.activeElement===document.getElementById('external-link')){e.preventDefault();document.getElementById('external-link').click();}
if(e.key==='Tab'){e.preventDefault();const a=document.getElementById('external-link'),b=document.getElementById('close-link');(document.activeElement===a?b:a).focus();}
},true);
createUnityInstance(canvas,{
arguments:[],dataUrl:'Build/Dreadgence-Demo-1.0.64.data.unityweb',frameworkUrl:'Build/Dreadgence-Demo-1.0.64.framework.js.unityweb',codeUrl:'Build/Dreadgence-Demo-1.0.64.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',
companyName:'Limited Input',productName:'Dreadgence',productVersion:'1.0.64',
autoSyncPersistentDataPath:true,devicePixelRatio:1,
showBanner:(message,type)=>{console[type==='error'?'error':'warn'](message);if(type==='error')document.getElementById('error').textContent=message;}
},p=>document.getElementById('progress').value=p).then(instance=>{
window.dreadgence=instance;performance.mark('dreadgence-engine-ready');document.getElementById('loading').hidden=true;canvas.focus();
}).catch(e=>{document.getElementById('error').textContent='The demo could not start. '+e;console.error(e);});
</script></body></html>
